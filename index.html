<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="數學小勇士">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
</head>
<body>
<title>小勇士數學島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Huninn&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen tablet game — home → map → battle scene (hero left, monster right, answer bubbles above); single bright theme by choice */
:root{
  --ink:#3B2A5C; --paper:#FFF6EA; --card:#FFFFFF; --pink:#FF6FA8; --yellow:#FFD23F;
  --mint:#3DDC97; --sky:#6EC8FF; --purple:#8C5CF5; --danger:#FF4D4D; --muted:#9A8FB3;
  --f-disp:"Baloo 2","Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}

/* ---------- shared bits ---------- */
.btn{border:0;border-radius:999px;padding:14px 28px;font:800 clamp(20px,3.2vmin,28px)/1 var(--f-disp);background:var(--yellow);
  box-shadow:0 6px 0 #D9A400;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #D9A400}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 #C93F7A}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 6px 0 #22A06B}
.btn.ghost{background:#fff;box-shadow:0 6px 0 #DDD3EC}
.round-btn{width:clamp(52px,8vmin,72px);height:clamp(52px,8vmin,72px);border-radius:50%;border:0;background:#fff;
  font-size:clamp(24px,4vmin,34px);box-shadow:0 5px 0 rgba(59,42,92,.18);display:grid;place-items:center;position:relative;flex:none}
.round-btn:active{transform:translateY(3px)}
h1,h2,h3{text-wrap:balance;margin:0}

/* ---------- home ---------- */
#home{background:
  radial-gradient(circle at 15% 20%,#FFE3F0 0 12%,transparent 13%),
  radial-gradient(circle at 85% 75%,#DFF4FF 0 16%,transparent 17%),
  radial-gradient(circle at 80% 15%,#FFF1B8 0 8%,transparent 9%),var(--paper);align-items:center;justify-content:center;gap:4vmin}
.logo{text-align:center}
.logo h1{font:800 clamp(40px,8vmin,84px)/1.05 var(--f-body);color:var(--purple);letter-spacing:.04em;
  text-shadow:0 5px 0 #fff,0 9px 0 rgba(140,92,245,.25)}
.logo p{margin:10px 0 0;font-size:clamp(17px,2.6vmin,24px);color:var(--muted)}
.kids{display:flex;gap:4vmin;flex-wrap:wrap;justify-content:center}
.kid{width:clamp(220px,32vmin,320px);border:0;border-radius:36px;background:#fff;padding:22px 18px 20px;display:flex;flex-direction:column;
  align-items:center;gap:8px;box-shadow:0 10px 0 rgba(59,42,92,.12);transition:transform .15s}
.kid:active{transform:scale(.96)}
.kid .av{width:62%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--bgc,#FFE9A8);overflow:hidden}
.kid .av svg{width:80%;height:80%}
.kid .nm{font-size:clamp(28px,4.6vmin,42px)}
.tag{display:inline-block;padding:4px 14px;border-radius:999px;font-size:clamp(15px,2.2vmin,20px);background:#F1EAFE;color:var(--purple)}
.kid .st{font:800 clamp(18px,2.6vmin,24px)/1 var(--f-disp);color:#E0A100}
.egg{font-size:9vmin}
#gear{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));opacity:.75}
#gearHint{position:absolute;top:calc(max(14px,env(safe-area-inset-top,0px)) + 76px);right:max(16px,env(safe-area-inset-right,0px));
  font-size:14px;color:var(--muted);opacity:0;transition:opacity .2s}
#gearRing{position:absolute;inset:-6px;border-radius:50%;border:5px solid var(--purple);clip-path:inset(0 100% 0 0);pointer-events:none}
#sync{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;font-size:13px;color:var(--muted)}

/* ---------- pick character ---------- */
#pick{background:linear-gradient(#DFF4FF,#FFF6EA);align-items:center;justify-content:center;gap:4vmin;text-align:center}
#pick h2{font-size:clamp(30px,5.4vmin,52px)}
.chars{display:flex;gap:3vmin;flex-wrap:wrap;justify-content:center}
.chars button{border:0;background:#fff;border-radius:32px;padding:16px;width:clamp(170px,26vmin,260px);box-shadow:0 8px 0 rgba(59,42,92,.12);
  display:flex;flex-direction:column;align-items:center;gap:6px;font-size:clamp(20px,3vmin,28px)}
.chars button svg{width:78%;overflow:visible;animation:bob 1.6s ease-in-out infinite}
.chars button:nth-child(2) svg{animation-delay:.3s}.chars button:nth-child(3) svg{animation-delay:.6s}

/* ---------- map ---------- */
#map{background:#FFF6EA}
.mapbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mapbar .who{display:flex;align-items:center;gap:10px;font-size:clamp(22px,3.4vmin,32px);flex:1;min-width:0}
.mapbar .who .mini{width:clamp(48px,7vmin,64px);height:clamp(48px,7vmin,64px);border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden}
.mapbar .who .mini svg{width:80%}
.starpill{font:800 clamp(18px,2.8vmin,26px)/1 var(--f-disp);background:#fff;border-radius:999px;padding:10px 18px;box-shadow:0 4px 0 rgba(59,42,92,.1)}
.worlds{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:22px;padding-bottom:30px;padding-top:4px}
.world{border-radius:34px;padding:20px 22px 26px;color:#fff;position:relative;overflow:hidden;flex:none}
.world h3{font-size:clamp(24px,3.8vmin,36px);text-shadow:0 3px 0 rgba(0,0,0,.18)}
.world .sub{font-size:clamp(15px,2.2vmin,20px);opacity:.92;margin-top:2px}
.world .deco{position:absolute;right:18px;top:10px;font-size:clamp(40px,7vmin,70px);opacity:.9}
.nodes{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:20px;position:relative}
.nodes::before{content:"";position:absolute;left:6%;right:6%;top:calc(clamp(64px,10vmin,92px)/2);border-top:6px dashed rgba(255,255,255,.6)}
.node{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.node button{width:clamp(64px,10vmin,92px);height:clamp(64px,10vmin,92px);border-radius:50%;border:0;background:#fff;color:var(--ink);
  font:800 clamp(28px,4.6vmin,42px)/1 var(--f-disp);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.node button.boss{background:var(--yellow);font-size:clamp(30px,5vmin,46px)}
.node button.next{animation:pulse 1.2s ease-in-out infinite}
.node button:disabled{background:rgba(255,255,255,.45);color:rgba(59,42,92,.45);box-shadow:none;font-size:clamp(22px,3.6vmin,32px)}
.node .ss{font-size:clamp(14px,2.2vmin,20px);letter-spacing:1px;min-height:1.2em;text-align:center}
.world.locked{filter:grayscale(.6);opacity:.7}
.th-candy{background:linear-gradient(135deg,#FF8CC6,#FFB86B)}
.th-ocean{background:linear-gradient(135deg,#3DB7FF,#38D6C4)}
.th-castle{background:linear-gradient(135deg,#8C5CF5,#E072D8)}
.th-volcano{background:linear-gradient(135deg,#FF6B4A,#FFB13D)}

/* ---------- stickers ---------- */
#book{background:linear-gradient(#FFF1B8,#FFF6EA)}
.stickers{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(90px,14vmin,130px),1fr));gap:16px;padding-bottom:20px;align-content:start}
.stk{aspect-ratio:1;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:clamp(46px,8vmin,72px);box-shadow:0 6px 0 rgba(59,42,92,.1)}
.stk.no{background:rgba(255,255,255,.5);color:#D7CDE6;font:800 clamp(34px,6vmin,56px)/1 var(--f-disp);box-shadow:none;border:4px dashed #E6DDF2}

/* ---------- battle scene ---------- */
#game{overflow:hidden}
#sky{position:absolute;inset:0}
#strip{position:absolute;left:0;bottom:20%;width:400vw;height:46%;transition:transform .9s cubic-bezier(.3,.7,.3,1)}
#strip svg{position:absolute;inset:0;width:100%;height:100%}
#strip .d{position:absolute;bottom:4%;font-size:9vmin;line-height:1}
#ground{position:absolute;left:0;right:0;bottom:0;height:21%;transition:background-position .9s cubic-bezier(.3,.7,.3,1)}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:12px;z-index:8;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#hearts{display:flex;gap:4px;font-size:clamp(30px,5vmin,46px);line-height:1;padding-top:8px}
#hearts .h{transition:transform .3s,opacity .3s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
#hearts .h.gone{transform:scale(.6);opacity:.25;filter:grayscale(1)}
#target{flex:1;display:flex;justify-content:center;min-width:0}
.tcard{background:#fff;border-radius:28px;padding:8px 26px;display:flex;align-items:center;gap:14px;box-shadow:0 7px 0 rgba(59,42,92,.15);
  min-height:clamp(64px,10vmin,96px);animation:popin .35s cubic-bezier(.3,1.6,.5,1);max-width:100%}
.tlabel{font-size:clamp(22px,3.6vmin,34px);white-space:nowrap}
.tnum{font:800 clamp(46px,8vmin,78px)/1 var(--f-disp);color:var(--pink)}
.texpr{font:800 clamp(32px,5.6vmin,56px)/1 var(--f-disp);color:var(--purple);white-space:nowrap}
.tdots{display:flex;flex-wrap:wrap;gap:4px;max-width:30vmin}
.tdots i{width:clamp(14px,2.2vmin,22px);height:clamp(14px,2.2vmin,22px);border-radius:50%;background:var(--pink);display:block}
.tgrp{font-size:clamp(26px,4.4vmin,42px);display:flex;flex-wrap:wrap;max-width:38vmin;justify-content:center;line-height:1.1}
#wave{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(12px,env(safe-area-inset-top,0px)) + clamp(80px,12.5vmin,116px));
  z-index:7;display:flex;gap:8px;font-size:clamp(22px,3.6vmin,32px);background:rgba(255,255,255,.7);padding:4px 14px;border-radius:99px}
#wave span.dead{filter:grayscale(1);opacity:.35}
#field{position:absolute;left:3%;right:3%;top:23%;bottom:47%;z-index:7}
@media (orientation:portrait){#field{top:18%;bottom:44%}}
.bub{position:absolute;width:var(--bs);height:var(--bs);margin:calc(var(--bs) / -2) 0 0 calc(var(--bs) / -2);border-radius:50%;border:0;padding:6%;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,0) 9%),
    radial-gradient(circle at 50% 55%,var(--c1) 0 55%,var(--c2) 100%);
  box-shadow:inset 0 -9px 0 rgba(0,0,0,.12),0 8px 0 rgba(59,42,92,.16);color:#fff;
  font:800 calc(var(--bs) * .27)/1 var(--f-disp);text-shadow:0 3px 0 rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  animation:popin .4s cubic-bezier(.3,1.6,.5,1) both,float 3s ease-in-out .4s infinite}
.bub .ex{white-space:nowrap}
.bub .ex.long{font-size:calc(var(--bs) * .21)}
.bub .ex.xl{font-size:calc(var(--bs) * .17)}
.bub .grp{display:flex;flex-wrap:wrap;justify-content:center;max-width:88%;line-height:1.05;text-shadow:none}
.bub .bignum{font-size:calc(var(--bs) * .42)}
.bub .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:86%}
.bub .dots i{width:calc(var(--bs) * .075);height:calc(var(--bs) * .075);border-radius:50%;background:#fff;display:block;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bub .dots i.b{background:#3B2A5C}
.bub.wrong{animation:shake .45s;filter:grayscale(1) brightness(.9);opacity:.45;pointer-events:none}
.bub.wrong::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--bs) * .7);color:var(--danger);text-shadow:0 3px 0 #fff}
.bub.pop{animation:pop .45s ease-out forwards;pointer-events:none}
.bub.fade{animation:fadeout .3s forwards;pointer-events:none}
.c0{--c1:#FF7AB6;--c2:#E2488C}.c1{--c1:#4FC3FF;--c2:#2196E0}.c2{--c1:#7BE07F;--c2:#3CB54A}
.c3{--c1:#FFB547;--c2:#F08A12}.c4{--c1:#B48CFF;--c2:#8456EA}.c5{--c1:#FF6B6B;--c2:#E03E3E}

#hero{position:absolute;left:7%;bottom:19%;width:clamp(96px,17vmin,170px);z-index:6;transform-origin:50% 100%}
#hero svg{width:100%;display:block;overflow:visible;animation:bob 1.4s ease-in-out infinite}
.sword{transform-box:view-box;transform-origin:96px 90px;transform:rotate(28deg)}
#hero.atk{animation:dash .72s cubic-bezier(.3,.7,.4,1)}
#hero.atk .sword{animation:swing .72s}
#hero.hurt{animation:hurt .5s}
#hero.dance svg{animation:dance .5s ease-in-out infinite}
#hero.dance .sword{animation:raise .5s ease-in-out infinite alternate}
#hero.dead{transition:transform .6s;transform:rotate(-90deg) translateY(10%)}
#hero.dead svg{animation:none}
#hero .sweat{position:absolute;right:0;top:4%;font-size:4vmin;opacity:0;transition:opacity .3s}
#hero.scared .sweat{opacity:1}
.xeyes{display:none}
.dead .eyes{display:none}.dead .xeyes{display:inline}
#foe{position:absolute;right:5%;bottom:19%;width:clamp(120px,22vmin,220px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:5px}
#foe.boss{width:clamp(150px,26vmin,260px)}
.foebar{width:92%;display:flex;flex-direction:column;gap:4px;align-items:center}
#foeName{font-size:clamp(14px,2.2vmin,20px);background:rgba(255,255,255,.88);padding:2px 12px;border-radius:99px;white-space:nowrap}
.hp,.charge{width:100%;height:14px;border-radius:99px;background:rgba(59,42,92,.35);overflow:hidden;border:3px solid #fff;box-sizing:content-box}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF4D4D,#FF8A8A);transition:width .3s}
.charge{height:9px;position:relative}
.charge i{display:block;height:100%;width:0;background:#FFB13D}
#foe.danger .charge i{background:#FF4D4D;animation:blink .35s infinite}
#monster{width:100%;transform-origin:50% 100%}
#monster svg{width:100%;display:block;overflow:visible;animation:wob 1.1s ease-in-out infinite;transform-origin:50% 100%}
#foe.danger #monster svg{animation-duration:.4s}
#monster.hit{animation:hitm .4s}
#monster.lunge{animation:lunge .65s cubic-bezier(.4,0,.3,1)}
#monster.ko{animation:ko .7s forwards}
#monster.enter{animation:enter .65s cubic-bezier(.3,1.3,.5,1)}
#monster.laugh svg{animation:dance .4s infinite}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.spark{position:absolute;font-size:5vmin;animation:spark .8s ease-out forwards}
.slash{position:absolute;width:30vmin;height:30vmin;margin:-15vmin 0 0 -15vmin;border-radius:50%;border-top:1.6vmin solid #fff;
  border-right:1vmin solid rgba(255,255,255,.6);filter:drop-shadow(0 0 10px #FFF6A8);animation:slash .35s ease-out forwards}
.slash.big{border-top-color:#FFE14D;width:42vmin;height:42vmin;margin:-21vmin 0 0 -21vmin}
.dmg{position:absolute;font:800 clamp(36px,7vmin,70px)/1 var(--f-disp);color:#FF4D4D;-webkit-text-stroke:3px #fff;animation:dmg .9s ease-out forwards}
.combo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:800 clamp(40px,8.5vmin,88px)/1 var(--f-disp);color:var(--yellow);
  -webkit-text-stroke:3px #C93F7A;text-shadow:0 6px 0 #C93F7A;animation:combo 1s ease-out forwards;white-space:nowrap}
.combo.ouch{color:#fff;-webkit-text-stroke:3px #B42318;text-shadow:0 6px 0 #B42318}
.conf{position:absolute;top:-5%;width:14px;height:22px;border-radius:4px;animation:fall linear forwards}

/* ---------- overlay ---------- */
#ov{position:absolute;inset:0;z-index:20;background:rgba(59,42,92,.55);display:grid;place-items:center;padding:16px}
.panel{background:#fff;border-radius:40px;padding:clamp(22px,4vmin,40px);text-align:center;max-width:min(640px,94vw);max-height:92%;overflow:auto;
  box-shadow:0 14px 0 rgba(0,0,0,.18);animation:popin .4s cubic-bezier(.3,1.6,.5,1);display:flex;flex-direction:column;gap:18px;align-items:center}
.panel h2{font-size:clamp(32px,6vmin,58px);color:var(--purple)}
.panel p{margin:0;font-size:clamp(18px,2.8vmin,26px)}
.panel .row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lineup{display:flex;gap:10px;align-items:flex-end;justify-content:center}
.lineup svg{width:clamp(70px,12vmin,110px);overflow:visible}
.lineup.boss svg{width:clamp(130px,22vmin,200px)}
.bigstars{font-size:clamp(54px,11vmin,110px);letter-spacing:6px;line-height:1}
.bigstars span{display:inline-block;animation:popin .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars span.off{filter:grayscale(1);opacity:.3}
.chest{font-size:clamp(100px,22vmin,200px);border:0;background:none;line-height:1;animation:wob 1s ease-in-out infinite}
.got{font-size:clamp(100px,22vmin,200px);line-height:1;animation:popin .6s cubic-bezier(.3,1.8,.5,1)}
.panel .heroBig{width:clamp(110px,20vmin,180px)}
.panel .heroBig svg{overflow:visible}
.parent{text-align:left;align-items:stretch;width:min(640px,94vw)}
.parent .kidset{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;background:#F7F2FF;border-radius:22px;padding:16px}
.parent label{font-size:18px}
.parent input,.parent select{font:inherit;font-size:20px;padding:8px 12px;border-radius:14px;border:2px solid #E3D8F6;background:#fff;color:var(--ink);min-width:0}
.parent .acts{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.parent .acts button,.toggles button{border:0;border-radius:14px;padding:10px 14px;font-size:17px;background:#fff;box-shadow:0 3px 0 #E3D8F6}
.parent .acts button.warn{background:#FFE3E3;color:#B42318}
.toggles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.toggles button.on{background:var(--mint);color:#fff}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1.6);opacity:0}}
@keyframes fadeout{to{transform:scale(.4);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(5px)}}
@keyframes dash{0%{transform:none}12%{transform:translateX(-12px) scale(1.05,.95)}38%,62%{transform:translateX(var(--dash))}100%{transform:none}}
@keyframes swing{0%{transform:rotate(28deg)}28%{transform:rotate(-55deg)}44%{transform:rotate(135deg)}66%{transform:rotate(135deg)}100%{transform:rotate(28deg)}}
@keyframes raise{from{transform:rotate(-20deg)}to{transform:rotate(-5deg)}}
@keyframes hurt{0%,100%{transform:none;filter:none}20%{transform:translateX(-16px);filter:brightness(1.4) sepia(1) hue-rotate(-50deg) saturate(5)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
@keyframes dance{0%,100%{transform:rotate(-8deg) translateY(0)}50%{transform:rotate(8deg) translateY(-12%)}}
@keyframes wob{0%,100%{transform:scale(1,1)}50%{transform:scale(1.05,.95)}}
@keyframes hitm{0%{filter:brightness(3) saturate(0);transform:none}30%{transform:translateX(20px) rotate(6deg)}60%{transform:translateX(-8px);filter:none}100%{transform:none}}
@keyframes lunge{0%{transform:none}15%{transform:translateX(16px)}42%,55%{transform:translateX(var(--lunge)) rotate(-12deg)}100%{transform:none}}

/* ================= question generators ================= */
function E(a, op, b) {
  const v = op === '+' ? a + b : op === '-' ? a - b : op === '×' ? a * b : a / b;
  return { a, b, op, v, t: `${a} ${op === '-' ? '−' : op} ${b}` };
}
const smallSets = {};
function smallSet(kind) {
  if (smallSets[kind]) return smallSets[kind];
  const out = [];
  const rng = {
    add3: () => { for (let a = 1; a <= 3; a++) for (let b = 1; a + b <= 4; b++) out.push(E(a, '+', b)); },
    add5: () => { for (let a = 1; a <= 5; a++) for (let b = 1; a + b <= 5; b++) out.push(E(a, '+', b)); },
    add10: () => { for (let a = 1; a <= 9; a++) for (let b = 1; a + b <= 10; b++) out.push(E(a, '+', b)); },
    sub5: () => { for (let a = 2; a <= 5; a++) for (let b = 1; b < a; b++) out.push(E(a, '-', b)); },
    sub10: () => { for (let a = 3; a <= 10; a++) for (let b = 1; b < a; b++) out.push(E(a, '-', b)); },
  };
  rng[kind]();
  return (smallSets[kind] = out);
}
const R = {
  add3: () => pick(smallSet('add3')),
  add5: () => pick(smallSet('add5')),
  add10: () => pick(smallSet('add10')),
  sub5: () => pick(smallSet('sub5')),
  sub10: () => pick(smallSet('sub10')),
  mix10: () => pick(smallSet(Math.random() < .5 ? 'add10' : 'sub10')),
  add20nc: () => { const a = rand(10, 18); return E(a, '+', rand(1, 9 - a % 10)); },
  sub20nb: () => { const a = rand(11, 19); return E(a, '-', rand(1, a % 10)); },
  add20c: () => { let a, b; do { a = rand(2, 9); b = rand(2, 9); } while (a + b < 11); return E(a, '+', b); },
  sub20b: () => { let a, b; do { a = rand(11, 18); b = rand(2, 9); } while (b <= a % 10); return E(a, '-', b); },
  mix20: () => pick([R.add20c, R.sub20b, R.add20c, R.sub20b, R.add20nc, R.sub20nb])(),

    const opts = [{ html: `<span class="bignum">${t}</span>`, ok: true }, ...ds.map(v => ({ html: `<span class="bignum">${v}</span>`, ok: false }))];
    return { target: `<span class="tlabel">有幾個？</span><div class="tgrp">${ico.repeat(t)}</div>`, say: `有幾個${nm}？`, opts };
  }
  if (type === 'more') {
    const [ico, nm] = pick(FRUITS);
    const most = Math.random() < .6;
    const vals = shuffle(Array.from({ length: L.max }, (_, i) => i + 1)).slice(0, n);
    const best = most ? Math.max(...vals) : Math.min(...vals);
    const opts = vals.map(v => ({ html: grpHTML(v, ico), ok: v === best }));
    const target = `<span class="tlabel">哪一個</span><span class="tnum" style="font-size:clamp(38px,6.4vmin,62px)">${most ? '最多' : '最少'}</span><span class="tlabel">${most ? '⬆️' : '⬇️'}</span>`;
    return { target, say: `哪一個${nm}${most ? '最多' : '最少'}？`, opts };
  }
  const gen = R[L.kind];
  if (type === 'miss') {
    const e = gen();
    const hideA = (e.op === '+' || e.op === '×') && Math.random() < .4;
    const ans = hideA ? e.a : e.b, sym = e.op === '-' ? '−' : e.op;

    const spoken = (hideA ? `多少${OPW[e.op]}${e.b}` : `${e.a}${OPW[e.op]}多少`) + `等於${e.v}？`;

  const need = n - good.length, bad = [];

  if (L.trap) for (const x of trapsOf(e)) { if (bad.length >= Math.ceil(need / 2)) break; add(x); }
  for (let i = 0; i < 600 && bad.length < need; i++) { const x = gen(); if (Math.abs(x.v - t) <= Math.max(3, t * .3)) add(x); }
  for (let i = 0; i < 600 && bad.length < need; i++) add(gen());

  const mk = (x, ok) => ({ ok, html: exTxt(x.t) + (L.dots ? (x.op === '+' ? dotsHTML(x.a, x.b) : dotsHTML(x.a - x.b, x.b, true)) : '') });
  const opts = [...good.map(x => mk(x, true)), ...bad.map(x => mk(x, false))];
  return { target: `<span class="tlabel">等於</span><span class="tnum">${t}</span>`, say: first ? `找出等於${t}的泡泡，攻擊怪獸！` : `等於${t}`, opts };
}

function go() {
  $('#ov').hidden = true;
  G.running = true; G.lock = false;
  nextRound(true);
  lastT = performance.now();
  cancelAnimationFrame(rafId); rafId = requestAnimationFrame(loop);
}
function loop(now) {
  const dt = Math.min(.1, (now - lastT) / 1000); lastT = now;
  if (G && G.running && !G.paused) {
    if (G.L.catch && !G.lock) {
      G.charge += dt / G.L.catch;
      if (G.charge >= 1) { G.lock = true; G.charge = 0; foeAttack(true).then(() => { if (G && G.running && G.hearts > 0) G.lock = false; }); }
    }
    $('#chFill').style.width = Math.min(100, G.charge * 100) + '%';
    const near = G.charge > .7;
    $('#foe').classList.toggle('danger', near);
    $('#hero').classList.toggle('scared', near);
    setMusicSpeed(near);
  }
  rafId = requestAnimationFrame(loop);
}
function nextRound(first) {
  const q = genRound(G.L, first); G.q = q;
  $('#target').innerHTML = `<div class="tcard">${q.target}</div>`;
  const opts = shuffle(q.opts.slice());
  const n = opts.length, rows = n <= 4 ? 1 : 2, cols = Math.ceil(n / rows);
  const cells = []; for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cells.push([c, r]);
  const use = rows === 1 ? cells : shuffle(cells).slice(0, n);
  const f = $('#field'); f.innerHTML = '';
  const fr = f.getBoundingClientRect();
  const bs = Math.min(fr.width / cols * .86, fr.height / rows * .92, 220);
  f.style.setProperty('--bs', bs + 'px');
  opts.forEach((o, i) => {
    const [c, r] = use[i];
    const b = document.createElement('button');
    b.className = `bub c${(i + rand(0, 5)) % 6}`;
    const jx = (Math.random() - .5) * .14, jy = rows === 1 ? (c % 2 ? .1 : -.1) + (Math.random() - .5) * .1 : (Math.random() - .5) * .14;
    b.style.left = ((c + .5 + jx) / cols * 100) + '%';
    b.style.top = (Math.max(.2, Math.min(.8, (r + .5 + jy) / rows)) * 100) + '%';
    b.style.animationDelay = `${i * .06}s, ${.4 + Math.random()}s`;
    b.innerHTML = o.html;
    b.onpointerdown = e => { e.preventDefault(); tapBubble(o, b); };
    f.appendChild(b);
  });
  say(q.say);
}
function fxAt(el) { const r = el.getBoundingClientRect(), fr = $('#fx').getBoundingClientRect(); return [r.left - fr.left + r.width / 2, r.top - fr.top + r.height / 2]; }
function sparks(el, glyphs, count = 9) {
  const [x, y] = fxAt(el);
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span'); s.className = 'spark'; s.textContent = pick(glyphs);
    s.style.left = x + 'px'; s.style.top = y + 'px';
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 100;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    $('#fx').appendChild(s); setTimeout(() => s.remove(), 850);
  }
}
function fxEl(cls, el, text) {
  const [x, y] = fxAt(el); const d = document.createElement('div'); d.className = cls;
  d.style.left = x + 'px'; d.style.top = y + 'px'; if (text) d.textContent = text;
  $('#fx').appendChild(d); setTimeout(() => d.remove(), 950);
}
function bigText(t, ouch) { const c = document.createElement('div'); c.className = 'combo' + (ouch ? ' ouch' : ''); c.textContent = t; $('#fx').appendChild(c); setTimeout(() => c.remove(), 1000); }

async function heroAttack(dmg) {
  const h = $('#hero'), m = $('#monster');
  const hr = h.getBoundingClientRect(), mr = m.getBoundingClientRect();
  h.style.setProperty('--dash', Math.max(0, mr.left - hr.right + hr.width * .45) + 'px');
  anim(h, 'atk'); SFX.swoosh();
  await wait(290);
  fxEl('slash' + (dmg > 1 ? ' big' : ''), m); SFX.hit(); anim(m, 'hit');
  sparks(m, dmg > 1 ? ['💥', '⭐', '🔥'] : ['💥', '✨'], 7);
  const f = G.foes[G.fi]; f.hp = Math.max(0, f.hp - dmg); renderFoe();
  fxEl('dmg', m, `-${dmg}`);
  await wait(450);
  h.classList.remove('atk');
}
async function foeAttack(timeUp) {
  const h = $('#hero'), m = $('#monster');
  const hr = h.getBoundingClientRect(), mr = m.getBoundingClientRect();
  m.style.setProperty('--lunge', -(mr.left - hr.right + hr.width * .25) + 'px');
  anim(m, 'lunge'); SFX.roar();
  if (timeUp) bigText('怪獸攻擊！', true);
  await wait(290);
  SFX.hurt(); sparks(h, ['💢', '💫'], 6);
  G.charge = 0;
  loseHeart();
  await wait(380);
  m.classList.remove('lunge');
}
function loseHeart() {
  G.hearts--; renderHearts();
  anim($('#hero'), 'hurt');
  if (G.hearts <= 0) die();
}
async function tapBubble(o, el) {
  if (!G || !G.running || G.lock || G.paused) return;
  G.lock = true;
  if (o.ok) {
    G.streak++;
    el.classList.add('pop'); sparks(el, ['⭐', '✨', '💖']);
    document.querySelectorAll('#field .bub:not(.pop)').forEach(b => b.classList.add('fade'));
    SFX.good();
    const dmg = G.streak >= 3 ? 2 : 1;
    if (dmg > 1) { bigText(`連擊 ×${G.streak}！雙倍攻擊`); SFX.combo(); }
    else bigText(pick(['答對了！', '好棒！', '厲害！', '太強了！']));
    G.charge = Math.max(0, G.charge - .4);
    await heroAttack(dmg);
    if (!G.running) return;
    if (G.foes[G.fi].hp <= 0) {
      anim($('#monster'), 'ko'); SFX.ko(); sparks($('#monster'), ['🪙', '⭐', '✨'], 12);
      bigText(G.L.boss ? '打倒大魔王！' : '打倒了！');
      renderWave();
      await wait(750);
      if (G.fi + 1 >= G.foes.length) { win(); return; }
      G.scroll += 22;
      $('#strip').style.transform = `translateX(-${G.scroll}vw)`;
      $('#ground').style.backgroundPosition = `0 0, -${G.scroll * 9}px 0`;
      G.charge = 0;
      setFoe(G.fi + 1); anim($('#monster'), 'enter'); renderWave(); SFX.roar();
      await wait(700);
      if (!G.running) return;
    }
    G.lock = false; nextRound(false);
  } else {
    G.streak = 0;
    el.classList.add('wrong'); SFX.bad();
    bigText('答錯了！怪獸反擊', true);
    await foeAttack(false);
    if (G.hearts > 0) { say(pick(['再想想看', '不對喔，再算一次', '仔細看看'])); if (G.running) G.lock = false; }
  }
}
async function die() {
  G.running = false; G.lock = true; setMusicSpeed(false);
  await wait(400);
  $('#hero').className = 'dead';
  anim($('#monster'), 'laugh');
  SFX.die();
  say('哎呀，勇者倒下了，我們再試一次！');
  await wait(1300);
  overlay(`<div class="heroBig dead">${charSVG(P[cur].char)}</div><h2>勇者倒下了！</h2>
    <p>錯了 3 次，這關要從頭開始。<br>算清楚再點喔！</p>
    <div class="row"><button class="btn pink" data-act="retry">再試一次</button><button class="btn ghost" data-act="map">回地圖</button></div>`);
}
async function win() {
  G.running = false; G.lock = true; setMusicSpeed(false);
  const k = P[cur], key = lvKey(k, G.wi, G.li);
  const stars = G.hearts, firstClear = !k.stars[key];
  k.stars[key] = Math.max(k.stars[key] || 0, stars);
  let newSticker = null;
  if (G.L.boss && firstClear) {
    const left = STICKERS.filter(s => !k.stickers.includes(s));
    newSticker = left.length ? pick(left) : null;
    if (newSticker) k.stickers.push(newSticker);
  }
  save(cur);
  $('#hero').classList.add('dance');
  $('#field').innerHTML = ''; $('#target').innerHTML = '';
  SFX.win(); confetti();
  say(stars === 3 ? '完美勝利！三顆星星！' : '勝利了！好厲害！');
  await wait(1200);
  const st = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}" style="animation-delay:${i * .2}s">⭐</span>`).join('');
  if (newSticker) {
    G.sticker = newSticker;
    overlay(`<h2>打倒大魔王！</h2><div class="bigstars">${st}</div><p>點寶箱打開看看！</p><button class="chest" data-act="chest" aria-label="打開寶箱">🎁</button>`);
  } else {
    overlay(`<h2>勝利！</h2><div class="bigstars">${st}</div>
      <p>${stars === 3 ? '一滴血都沒掉，太完美了！' : '再玩一次可以拿到更多星星喔！'}</p>
      <div class="row">${nextLevel() ? '<button class="btn mint" data-act="next">下一關 ▶</button>' : ''}
      <button class="btn ghost" data-act="retry">再玩一次</button><button class="btn ghost" data-act="map">回地圖</button></div>`);
  }
}
function nextLevel() {
  const W = WORLDS[P[cur].grade];
  if (G.li + 1 < W[G.wi].levels.length) return [G.wi, G.li + 1];
  if (G.wi + 1 < W.length) return [G.wi + 1, 0];
  return null;
}
function confetti() {
  const cols = ['#FF6FA8', '#FFD23F', '#3DDC97', '#6EC8FF', '#8C5CF5', '#FF8A3D'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div'); c.className = 'conf';
    c.style.left = Math.random() * 100 + '%'; c.style.background = pick(cols);
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; c.style.animationDelay = Math.random() * .5 + 's';
    $('#fx').appendChild(c); setTimeout(() => c.remove(), 3800);
  }
}
function pause() {
  if (!G || !G.running || G.paused) return;
  G.paused = true;
  overlay(`<h2>休息一下</h2>
    <div class="row"><button class="btn mint" data-act="resume">繼續 ▶</button><button class="btn ghost" data-act="retry">重新開始</button><button class="btn ghost" data-act="map">回地圖</button></div>
    <div class="toggles">${toggleBtns()}</div>`);
}
function toggleBtns() {
  return `<button data-act="t-music" class="${S.music ? 'on' : ''}">🎵 音樂</button><button data-act="t-sfx" class="${S.sfx ? 'on' : ''}">🔔 音效</button><button data-act="t-voice" class="${S.voice ? 'on' : ''}">🗣️ 唸題目</button>`;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ================= overlay & actions ================= */
function overlay(html) { const o = $('#ov'); o.innerHTML = `<div class="panel">${html}</div>`; o.hidden = false; }
function stopGame() { if (G) G.running = false; cancelAnimationFrame(rafId); setMusicSpeed(false); try { speechSynthesis.cancel(); } catch (e) {} }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  ac();
  if (a !== 'speak') SFX.tap();
  switch (a) {
    case 'home': stopGame(); renderHome(); break;
    case 'map': stopGame(); openMap(); break;
    case 'book': openBook(); break;
    case 'go': go(); break;
    case 'speak': say(lastSay); break;
    case 'pause': pause(); break;
    case 'resume': $('#ov').hidden = true; G.paused = false; lastT = performance.now(); say(lastSay); break;
    case 'retry': stopGame(); startLevel(G.wi, G.li); break;
    case 'next': { const n = nextLevel(); stopGame(); if (n) startLevel(n[0], n[1]); else openMap(); break; }
    case 'chest': {
      SFX.chest();
      overlay(`<h2>得到新貼紙！</h2><div class="got">${G.sticker}</div><p>已經放進貼紙簿囉！</p>
        <div class="row">${nextLevel() ? '<button class="btn mint" data-act="next">下一個世界 ▶</button>' : ''}<button class="btn ghost" data-act="book">看貼紙簿</button><button class="btn ghost" data-act="map">回地圖</button></div>`);
      confetti(); say('得到新貼紙了！');
      break;
    }
    case 't-music': case 't-sfx': case 't-voice': {
      const key = a.slice(2); S[key] = !S[key]; lsSet('mq-settings', S);
      b.classList.toggle('on', S[key]); if (key === 'music') musicOn();
      break;
    }
    case 'p-close': renderHome(); break;
  }
});

/* ================= parent settings (hold gear 2s) ================= */
(() => {
  const gear = $('#gear'), ring = $('#gearRing'), hint = $('#gearHint');
  let t0 = 0, raf = 0;
  const tick = () => {
    const p = Math.min(1, (performance.now() - t0) / 2000);
    ring.style.clipPath = `inset(0 ${100 - p * 100}% 0 0)`;
    if (p >= 1) { end(); openParent(); return; }
    raf = requestAnimationFrame(tick);
  };
  const start = e => { e.preventDefault(); t0 = performance.now(); hint.style.opacity = 1; raf = requestAnimationFrame(tick); };
  const end = () => { cancelAnimationFrame(raf); ring.style.clipPath = 'inset(0 100% 0 0)'; setTimeout(() => hint.style.opacity = 0, 1200); };
  gear.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => gear.addEventListener(ev, end));
  gear.addEventListener('contextmenu', e => e.preventDefault());
})();
function openParent() {
  const sets = KIDS.map(id => {
    const k = P[id];
    return `<div class="kidset" data-kid="${id}">
      <label for="nm-${id}">名字</label><input id="nm-${id}" value="${esc(k.name)}" maxlength="8">
      <label for="gr-${id}">程度</label><select id="gr-${id}"><option value="big" ${k.grade === 'big' ? 'selected' : ''}>大班（10以內加減→20以內）</option><option value="g2" ${k.grade === 'g2' ? 'selected' : ''}>小二（二位數加減、九九乘法→小三）</option></select>
      <div class="acts"><button data-p="char">換角色</button><button data-p="unlock">全部關卡解鎖</button><button class="warn" data-p="reset">清除進度</button></div>
    </div>`;
  }).join('');
  overlay(`<h2>家長設定</h2>${sets}<div class="toggles">${toggleBtns()}</div>
    <p style="font-size:15px;color:var(--muted)">不同程度的星星分開記錄；切換程度不會清掉原本的進度。</p>
    <div class="row"><button class="btn mint" data-act="p-close">完成</button></div>`);
  $('#ov .panel').classList.add('parent');
  KIDS.forEach(id => {
    $(`#nm-${id}`).onchange = e => { P[id].name = e.target.value.trim() || DEF[id].name; save(id); };
    $(`#gr-${id}`).onchange = e => { P[id].grade = e.target.value; save(id); };
  });
  $('#ov').querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const id = b.closest('.kidset').dataset.kid, k = P[id];
    if (b.dataset.p === 'char') { k.char = null; save(id); b.textContent = '下次進入會重選 ✓'; }
    if (b.dataset.p === 'unlock') {
      WORLDS[k.grade].forEach((W, wi) => W.levels.forEach((L, li) => { const key = lvKey(k, wi, li); if (!k.stars[key]) k.stars[key] = 1; }));
      save(id); b.textContent = '已解鎖 ✓';
    }
    if (b.dataset.p === 'reset') {
      if (b.dataset.armed) { k.stars = {}; k.stickers = []; save(id); b.textContent = '已清除 ✓'; delete b.dataset.armed; }
      else { b.dataset.armed = 1; b.textContent = '再按一次確認清除'; }
    }
  });
}

renderHome();
</script>
</body>
</html>
