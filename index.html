<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="數學小勇士">
<meta name="theme-color" content="#8C5CF5">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}</style>
</head>
<body>
<title>小勇士數學島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Huninn&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen tablet game — home → adventure map (winding road) → battle scene (hero left, monster right, answer bubbles above); single bright theme by choice */
:root{
  --ink:#3B2A5C; --paper:#FFF6EA; --card:#FFFFFF; --pink:#FF6FA8; --yellow:#FFD23F;
  --mint:#3DDC97; --sky:#6EC8FF; --purple:#8C5CF5; --danger:#FF4D4D; --muted:#9A8FB3;
  --f-disp:"Baloo 2","Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Huninn","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
svg{overflow:visible}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}

/* ---------- shared ---------- */
.btn{border:0;border-radius:999px;padding:14px 28px;font:800 clamp(20px,3.2vmin,28px)/1 var(--f-disp);background:var(--yellow);
  box-shadow:0 6px 0 #D9A400;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #D9A400}
.btn.pink{background:var(--pink);color:#fff;box-shadow:0 6px 0 #C93F7A}
.btn.mint{background:var(--mint);color:#fff;box-shadow:0 6px 0 #22A06B}
.btn.ghost{background:#fff;box-shadow:0 6px 0 #DDD3EC}
.round-btn{width:clamp(52px,8vmin,72px);height:clamp(52px,8vmin,72px);border-radius:50%;border:0;background:#fff;
  font-size:clamp(24px,4vmin,34px);box-shadow:0 5px 0 rgba(59,42,92,.18);display:grid;place-items:center;position:relative;flex:none}
.round-btn:active{transform:translateY(3px)}
h1,h2,h3{text-wrap:balance;margin:0}
.pill{font:800 clamp(16px,2.6vmin,24px)/1 var(--f-body);background:#fff;border-radius:999px;padding:10px 16px;box-shadow:0 4px 0 rgba(59,42,92,.1);white-space:nowrap}

/* ---------- home ---------- */
#home{background:
  radial-gradient(circle at 15% 20%,#FFE3F0 0 12%,transparent 13%),
  radial-gradient(circle at 85% 75%,#DFF4FF 0 16%,transparent 17%),
  radial-gradient(circle at 80% 15%,#FFF1B8 0 8%,transparent 9%),var(--paper);align-items:center;justify-content:center;gap:4vmin}
.logo{text-align:center}
.logo h1{font:800 clamp(40px,8vmin,84px)/1.05 var(--f-body);color:var(--purple);letter-spacing:.04em;text-shadow:0 5px 0 #fff,0 9px 0 rgba(140,92,245,.25)}
.logo p{margin:10px 0 0;font-size:clamp(17px,2.6vmin,24px);color:var(--muted)}
.kids{display:flex;gap:4vmin;flex-wrap:wrap;justify-content:center}
.kid{width:clamp(220px,32vmin,320px);border:0;border-radius:36px;background:#fff;padding:22px 18px 20px;display:flex;flex-direction:column;
  align-items:center;gap:8px;box-shadow:0 10px 0 rgba(59,42,92,.12);transition:transform .15s}
.kid:active{transform:scale(.96)}
.kid .av{width:66%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--bgc,#FFE9A8);overflow:hidden}
.kid .av svg{width:92%;height:92%}
.kid .nm{font-size:clamp(28px,4.6vmin,42px)}
.tag{display:inline-block;padding:4px 14px;border-radius:999px;font-size:clamp(15px,2.2vmin,20px);background:#F1EAFE;color:var(--purple)}
.kid .st{font:800 clamp(16px,2.4vmin,22px)/1.2 var(--f-body);color:#C98A00;text-align:center}
.egg{font-size:9vmin}
#gear{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));opacity:.75}
#gearHint{position:absolute;top:calc(max(14px,env(safe-area-inset-top,0px)) + 76px);right:max(16px,env(safe-area-inset-right,0px));font-size:14px;color:var(--muted);opacity:0;transition:opacity .2s}
#gearRing{position:absolute;inset:-6px;border-radius:50%;border:5px solid var(--purple);clip-path:inset(0 100% 0 0);pointer-events:none}
#sync{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:14px;font-size:13px;color:var(--muted)}

/* ---------- pick character ---------- */
#pick{background:linear-gradient(#DFF4FF,#FFF6EA);align-items:center;justify-content:center;gap:3vmin;text-align:center;overflow-y:auto}
#pick h2{font-size:clamp(28px,5vmin,48px)}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2.4vmin;width:min(960px,100%)}
@media (orientation:portrait){.chars{grid-template-columns:repeat(2,minmax(0,1fr));width:min(560px,100%)}}
.chars button{border:0;border-radius:28px;padding:10px 8px 12px;box-shadow:0 8px 0 rgba(59,42,92,.12);display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:clamp(17px,2.6vmin,24px);min-width:0}
.chars .cv{width:100%;aspect-ratio:1.05;display:grid;place-items:end center;overflow:hidden}
.chars .cv svg{width:78%;animation:bob 1.6s ease-in-out infinite}
.chars button:nth-child(2n) .cv svg{animation-delay:.4s}
.chars .bt{font-size:.75em;background:rgba(255,255,255,.8);border-radius:99px;padding:2px 10px}

/* ---------- map ---------- */
#map{background:#FFF6EA}
.mapbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:relative;z-index:2}
.mapbar .who{display:flex;align-items:center;gap:10px;font-size:clamp(20px,3.2vmin,30px);flex:1;min-width:0}
.mapbar .who .mini{width:clamp(48px,7vmin,64px);height:clamp(48px,7vmin,64px);border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.mapbar .who .mini svg{width:92%}
#mapScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;margin-top:12px;border-radius:30px}
.mapcanvas{position:relative;margin:0 auto}
.band{position:absolute;left:0;right:0;overflow:hidden}
.band:first-child{border-radius:30px 30px 0 0}
.bandhead{position:absolute;left:50%;top:18px;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:22px;padding:8px 22px;text-align:center;
  box-shadow:0 5px 0 rgba(0,0,0,.12);white-space:nowrap;z-index:3}
.bandhead b{display:block;font-size:clamp(20px,3.4vmin,30px)}
.bandhead span{font-size:clamp(13px,2vmin,18px);color:var(--muted)}
.band .dec{position:absolute;font-size:clamp(34px,6vmin,56px);line-height:1;transform:translate(-50%,-50%);opacity:.9}
.band.locked::after{content:"";position:absolute;inset:0;background:rgba(70,60,90,.45);z-index:2}
.lockmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;background:#fff;border-radius:22px;padding:12px 22px;font-size:clamp(18px,2.8vmin,24px);white-space:nowrap}
.road{position:absolute;left:0;top:0;pointer-events:none;z-index:1}
.mnode{position:absolute;transform:translate(-50%,-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:2px}
.mnode button{width:74px;height:74px;border-radius:50%;border:5px solid #fff;background:#fff;color:var(--ink);font:800 32px/1 var(--f-disp);
  box-shadow:0 6px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
.mnode.done button{background:var(--yellow);border-color:#fff}
.mnode.next button{background:var(--pink);color:#fff;animation:pulse 1.1s ease-in-out infinite}
.mnode button:disabled{background:#D9D3E6;color:#9A8FB3;box-shadow:none;font-size:26px}
.mnode.boss button{width:112px;height:112px;border:6px solid #FF4D4D;background:radial-gradient(circle,#FFE7A8,#FF9A5A);overflow:hidden}
.mnode.boss button svg{width:92%}
.mnode.boss button:disabled{background:#B9B1C9;border-color:#8E86A0}
.mnode.boss button:disabled svg{filter:grayscale(1) brightness(.5)}
.mnode .ss{font-size:16px;background:rgba(255,255,255,.85);border-radius:99px;padding:0 8px;min-height:1.2em;white-space:nowrap}
.mnode .ss:empty{visibility:hidden}
.mnode .bn{font-size:15px;background:#FF4D4D;color:#fff;border-radius:99px;padding:2px 10px;white-space:nowrap}
.token{position:absolute;width:76px;transform:translate(-110%,-92%);z-index:4;pointer-events:none;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.token svg{width:100%;animation:bob 1.2s ease-in-out infinite}
.th-candy{background:linear-gradient(#FFC2E0,#FFD9A8)}
.th-ocean{background:linear-gradient(#9EE2FF,#7FE3D6)}
.th-desert{background:linear-gradient(#FFE29A,#FFC97A)}
.th-volcano{background:linear-gradient(#FFB08A,#E87A5A)}
.th-snow{background:linear-gradient(#E3F3FF,#BFE0FF)}
.th-castle{background:linear-gradient(#B9A4FF,#7E64D9)}

/* ---------- stickers ---------- */
#book{background:linear-gradient(#FFF1B8,#FFF6EA)}
.stickers{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(90px,14vmin,130px),1fr));gap:16px;padding-bottom:20px;align-content:start}
.stk{aspect-ratio:1;border-radius:26px;background:#fff;display:grid;place-items:center;font-size:clamp(46px,8vmin,72px);box-shadow:0 6px 0 rgba(59,42,92,.1)}
.stk.no{background:rgba(255,255,255,.5);color:#D7CDE6;font:800 clamp(34px,6vmin,56px)/1 var(--f-disp);box-shadow:none;border:4px dashed #E6DDF2}

/* ---------- battle ---------- */
#game{overflow:hidden}
#game.shake{animation:shake .5s 2}
#sky{position:absolute;inset:0}
#strip{position:absolute;left:0;bottom:20%;width:400vw;height:46%;transition:transform .9s cubic-bezier(.3,.7,.3,1)}
#strip svg{position:absolute;inset:0;width:100%;height:100%}
#strip .d{position:absolute;bottom:4%;font-size:9vmin;line-height:1}
#ground{position:absolute;left:0;right:0;bottom:0;height:21%;transition:background-position .9s cubic-bezier(.3,.7,.3,1)}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:12px;z-index:8;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.hudl{display:flex;flex-direction:column;gap:6px}
#hearts{display:flex;gap:4px;font-size:clamp(30px,5vmin,46px);line-height:1;padding-top:6px}
#hearts .h{transition:transform .3s,opacity .3s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.15))}
#hearts .h.gone{transform:scale(.6);opacity:.25;filter:grayscale(1)}
#weapon{font-size:clamp(13px,2vmin,17px);background:rgba(255,255,255,.88);border-radius:99px;padding:3px 10px;align-self:flex-start;white-space:nowrap}
#target{flex:1;display:flex;justify-content:center;min-width:0}
.tcard{background:#fff;border-radius:28px;padding:8px 26px;display:flex;align-items:center;gap:14px;box-shadow:0 7px 0 rgba(59,42,92,.15);
  min-height:clamp(64px,10vmin,96px);animation:popin .35s cubic-bezier(.3,1.6,.5,1);max-width:100%}
.tlabel{font-size:clamp(22px,3.6vmin,34px);white-space:nowrap}
.tnum{font:800 clamp(46px,8vmin,78px)/1 var(--f-disp);color:var(--pink)}
.texpr{font:800 clamp(32px,5.6vmin,56px)/1 var(--f-disp);color:var(--purple);white-space:nowrap}
.tgrp{font-size:clamp(26px,4.4vmin,42px);display:flex;flex-wrap:wrap;max-width:38vmin;justify-content:center;line-height:1.1}
#wave{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(12px,env(safe-area-inset-top,0px)) + clamp(80px,12.5vmin,116px));
  z-index:7;display:flex;gap:8px;font-size:clamp(22px,3.6vmin,32px);background:rgba(255,255,255,.7);padding:4px 14px;border-radius:99px}
#wave span.dead{filter:grayscale(1);opacity:.35}
#field{position:absolute;left:3%;right:3%;top:23%;bottom:47%;z-index:7}
#game.bosslv #field{right:40%}
@media (orientation:portrait){#field{top:18%;bottom:44%}#game.bosslv #field{right:3%;bottom:53%}}
.bub{position:absolute;width:var(--bs);height:var(--bs);margin:calc(var(--bs) / -2) 0 0 calc(var(--bs) / -2);border-radius:50%;border:0;padding:6%;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.95) 0 8%,rgba(255,255,255,0) 9%),radial-gradient(circle at 50% 55%,var(--c1) 0 55%,var(--c2) 100%);
  box-shadow:inset 0 -9px 0 rgba(0,0,0,.12),0 8px 0 rgba(59,42,92,.16);color:#fff;font:800 calc(var(--bs) * .27)/1 var(--f-disp);text-shadow:0 3px 0 rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:popin .4s cubic-bezier(.3,1.6,.5,1) both,float 3s ease-in-out .4s infinite}
.bub .ex{white-space:nowrap}
.bub .ex.long{font-size:calc(var(--bs) * .21)}
.bub .ex.xl{font-size:calc(var(--bs) * .17)}
.bub .grp{display:flex;flex-wrap:wrap;justify-content:center;max-width:88%;line-height:1.05;text-shadow:none}
.bub .bignum{font-size:calc(var(--bs) * .42)}
.bub .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:86%}
.bub .dots i{width:calc(var(--bs) * .075);height:calc(var(--bs) * .075);border-radius:50%;background:#fff;display:block;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.bub .dots i.b{background:#3B2A5C}
.bub.wrong{animation:shake .45s;filter:grayscale(1) brightness(.9);opacity:.45;pointer-events:none}
.bub.wrong::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--bs) * .7);color:var(--danger);text-shadow:0 3px 0 #fff}
.bub.pop{animation:pop .45s ease-out forwards;pointer-events:none}
.bub.fade{animation:fadeout .3s forwards;pointer-events:none}
.c0{--c1:#FF7AB6;--c2:#E2488C}.c1{--c1:#4FC3FF;--c2:#2196E0}.c2{--c1:#7BE07F;--c2:#3CB54A}
.c3{--c1:#FFB547;--c2:#F08A12}.c4{--c1:#B48CFF;--c2:#8456EA}.c5{--c1:#FF6B6B;--c2:#E03E3E}

#hero{position:absolute;left:5%;bottom:19%;width:clamp(110px,19vmin,190px);z-index:6;transform-origin:50% 100%}
#hero svg{width:100%;display:block;animation:bob 1.4s ease-in-out infinite}
#hero.t3 svg{filter:drop-shadow(0 0 8px #FFE14D)}
#hero.t4 svg{filter:drop-shadow(0 0 10px #7FE0FF)}
#hero.t5 svg{filter:drop-shadow(0 0 14px #FFE14D) drop-shadow(0 0 4px #fff)}
.sword{transform-box:view-box;transform:rotate(28deg)}
#hero.atk{animation:dash .72s cubic-bezier(.3,.7,.4,1)}
#hero.atk .sword{animation:swing .72s}
#hero.hurt{animation:hurt .5s}
#hero.dance svg{animation:dance .5s ease-in-out infinite}
#hero.dance .sword{animation:raise .5s ease-in-out infinite alternate}
#hero.dead{transition:transform .6s;transform:rotate(-90deg) translateY(10%)}
#hero.dead svg{animation:none}
#hero .sweat{position:absolute;right:0;top:4%;font-size:4vmin;opacity:0;transition:opacity .3s}
#hero.scared .sweat{opacity:1}
.xeyes{display:none}
.dead .eyes{display:none}.dead .xeyes{display:inline}
#foe{position:absolute;right:5%;bottom:19%;width:clamp(120px,22vmin,220px);z-index:5;display:flex;flex-direction:column;align-items:center;gap:5px}
#foe.boss{width:clamp(200px,34vmin,340px);right:3%}
#foe.boss::before{content:"";position:absolute;left:-15%;right:-15%;top:5%;bottom:-8%;border-radius:50%;
  background:radial-gradient(circle,var(--aura,#FF5A3D) 0,transparent 68%);opacity:.55;animation:aura 1.1s ease-in-out infinite alternate;z-index:-1}
#foe.rage::before{opacity:.9;animation-duration:.4s}
#foe.rage #monster svg{filter:saturate(1.6) brightness(1.05) drop-shadow(0 0 14px #FF2D2D);animation-duration:.45s}
.foebar{width:92%;display:flex;flex-direction:column;gap:4px;align-items:center}
#foeName{font-size:clamp(14px,2.2vmin,20px);background:rgba(255,255,255,.9);padding:2px 12px;border-radius:99px;white-space:nowrap}
#foe.boss #foeName{background:#2A1840;color:#FFD23F;font-size:clamp(17px,2.8vmin,24px);padding:4px 16px}
.hp,.charge{width:100%;height:14px;border-radius:99px;background:rgba(59,42,92,.35);overflow:hidden;border:3px solid #fff;box-sizing:content-box}
#foe.boss .hp{height:22px}
.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF4D4D,#FF8A8A);transition:width .3s}
.charge{height:9px}
.charge i{display:block;height:100%;width:0;background:#FFB13D}
#foe.danger .charge i{background:#FF4D4D;animation:blink .35s infinite}
#monster{width:100%;transform-origin:50% 100%}
#monster svg{width:100%;display:block;animation:wob 1.1s ease-in-out infinite;transform-origin:50% 100%}
#foe.danger #monster svg{animation-duration:.4s}
#monster.hit{animation:hitm .4s}
#monster.lunge{animation:lunge .65s cubic-bezier(.4,0,.3,1)}
#monster.ko{animation:ko .8s forwards}
#monster.enter{animation:enter .65s cubic-bezier(.3,1.3,.5,1)}
#monster.laugh svg{animation:dance .4s infinite}
#fx{position:absolute;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.spark{position:absolute;font-size:5vmin;animation:spark .8s ease-out forwards}
.slash{position:absolute;width:30vmin;height:30vmin;margin:-15vmin 0 0 -15vmin;border-radius:50%;border-top:1.6vmin solid #fff;
  border-right:1vmin solid rgba(255,255,255,.6);filter:drop-shadow(0 0 10px #FFF6A8);animation:slash .35s ease-out forwards}
.slash.rev{animation-name:slash2}
.slash.big{width:42vmin;height:42vmin;margin:-21vmin 0 0 -21vmin;border-top-color:#FFE14D}
.slash.fire{border-top-color:#FF7A3D;border-right-color:#FFD23F;filter:drop-shadow(0 0 14px #FF7A3D)}
.slash.ice{border-top-color:#9BE8FF;border-right-color:#fff;filter:drop-shadow(0 0 14px #3DB7FF)}
.bolt{position:absolute;top:0;width:90px;margin-left:-45px;animation:fadeout2 .5s forwards}
.bolt svg{width:100%;height:100%;display:block}
.beam{position:absolute;top:0;width:120px;margin-left:-60px;background:linear-gradient(rgba(255,246,168,0),#FFF6A8 30%,#fff);box-shadow:0 0 50px 20px rgba(255,225,77,.7);
  border-radius:0 0 60px 60px;animation:beam .7s ease-out forwards}
.dragon{position:absolute;font-size:16vmin;line-height:1;margin:-8vmin 0 0 -8vmin;animation:dragon .4s ease-in forwards;filter:drop-shadow(0 0 12px #7FE0FF)}
.flash{position:absolute;inset:0;background:#fff;animation:flash .35s forwards}
.dmg{position:absolute;font:800 clamp(36px,7vmin,70px)/1 var(--f-disp);color:#FF4D4D;-webkit-text-stroke:3px #fff;animation:dmg .9s ease-out forwards}
.combo{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:800 clamp(38px,8vmin,84px)/1 var(--f-body);color:var(--yellow);
  -webkit-text-stroke:3px #C93F7A;text-shadow:0 6px 0 #C93F7A;animation:combo 1.1s ease-out forwards;white-space:nowrap}
.combo.ouch{color:#fff;-webkit-text-stroke:3px #B42318;text-shadow:0 6px 0 #B42318}
.conf{position:absolute;top:-5%;width:14px;height:22px;border-radius:4px;animation:fall linear forwards}

/* ---------- overlay ---------- */
#ov{position:absolute;inset:0;z-index:20;background:rgba(59,42,92,.6);display:grid;place-items:center;padding:16px}
#ov.dark{background:rgba(20,8,30,.85)}
.panel{background:#fff;border-radius:40px;padding:clamp(22px,4vmin,40px);text-align:center;max-width:min(660px,94vw);max-height:92%;overflow:auto;
  box-shadow:0 14px 0 rgba(0,0,0,.18);animation:popin .4s cubic-bezier(.3,1.6,.5,1);display:flex;flex-direction:column;gap:16px;align-items:center}
.panel h2{font-size:clamp(30px,5.6vmin,54px);color:var(--purple)}

<script>
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wait = ms => new Promise(r => setTimeout(r, ms));
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

/* ================= heroes: 8 body types × 6 gear tiers ================= */
const CHARS = {
  dino:    { name: '恐龍 波波',   tag: '標準', main: '#5ED37A', dark: '#2E9E52', belly: '#D9F8CB', bg: '#E3F9DA', shape: 'mid' },
  cat:     { name: '貓咪 咪咪',   tag: '靈活', main: '#FFA94D', dark: '#E07A1F', belly: '#FFE6C7', bg: '#FFEBD3', shape: 'mid' },
  bunny:   { name: '兔兔 跳跳',   tag: '長耳朵', main: '#FF9EC7', dark: '#E5679F', belly: '#FFFFFF', bg: '#FFE3F0', shape: 'mid' },
  bear:    { name: '胖胖熊 墩墩', tag: '胖', main: '#B07A4F', dark: '#7D5232', belly: '#F2D6B8', bg: '#F5E6D6', shape: 'fat' },
  giraffe: { name: '長頸鹿 高高', tag: '高', main: '#FFC845', dark: '#C98A12', belly: '#FFF1C9', bg: '#FFF5D6', shape: 'tall' },
  penguin: { name: '企鵝 矮咚咚', tag: '矮', main: '#3B4A6B', dark: '#26314A', belly: '#FFFFFF', bg: '#E3ECFF', shape: 'short' },
  fox:     { name: '狐狸 瘦皮猴', tag: '瘦', main: '#FF7A3D', dark: '#C9541C', belly: '#FFF0E3', bg: '#FFE6D9', shape: 'thin' },
  pig:     { name: '小豬 圓圓',   tag: '圓滾滾', main: '#FFAFC0', dark: '#E77D95', belly: '#FFE3EA', bg: '#FFE9EE', shape: 'round' },
};
const SHAPES = {
  mid:   { bx: 31, by: 27, bcy: 86, hr: 33, hcy: 48 },
  fat:   { bx: 43, by: 30, bcy: 84, hr: 33, hcy: 44 },
  tall:  { bx: 25, by: 26, bcy: 88, hr: 25, hcy: 0, neck: true },
  short: { bx: 29, by: 21, bcy: 94, hr: 27, hcy: 63 },
  thin:  { bx: 20, by: 28, bcy: 86, hr: 27, hcy: 46 },
  round: { bx: 37, by: 31, bcy: 84, hr: 35, hcy: 45 },
};
const TIERS = [
  { w: '木劍',     atk: '普通斬',   len: 40, blade: '#D9A066', edge: '#8B5A2B', guard: '#8B5A2B', cape: null },
  { w: '鐵劍',     atk: '二連斬',   len: 50, blade: '#E3E9F2', edge: '#8FA6CC', guard: '#8E9BB3', cape: '#8B5A2B', helm: '#AEB8C8', helmDk: '#7D879A' },
  { w: '火焰劍',   atk: '火焰斬',   len: 54, blade: '#FF7A3D', edge: '#C9341C', guard: '#FFD23F', cape: '#E8414A', helm: '#D7DEEA', helmDk: '#8E9BB3', plume: '#E8414A', armor: true },
  { w: '雷電劍',   atk: '閃電劈',   len: 58, blade: '#FFE14D', edge: '#3D7BFF', guard: '#3D7BFF', cape: '#3D7BFF', helm: '#D7DEEA', helmDk: '#8E9BB3', plume: '#3D7BFF', armor: true },
  { w: '冰龍劍',   atk: '冰龍衝擊', len: 62, blade: '#BFF3FF', edge: '#3DB7FF', guard: '#FFD23F', cape: '#8C5CF5', helm: '#FFD23F', helmDk: '#D99A00', horns: true, armor: true, gold: true },
  { w: '傳說聖劍', atk: '天降光柱', len: 72, blade: '#FFF6A8', edge: '#E0A100', guard: '#FFD23F', cape: '#FFFFFF', helm: '#FFD23F', helmDk: '#D99A00', gem: true, armor: true, gold: true, wings: true, halo: true },
];
function charSVG(k, tier = 0) {
  const c = CHARS[k] || CHARS.dino, s = SHAPES[c.shape], T = TIERS[Math.max(0, Math.min(5, tier))];
  const cx = 60, r = s.hr, cy = s.hcy, bx = s.bx, by = s.by, bcy = s.bcy;
  const hx = cx + bx + 2, hy = bcy + 4;
  const f = n => Math.round(n * 10) / 10;
  let o = '';
  // wings & cape (behind everything)
  if (T.wings) {
    const wing = `<path d="M${cx - 8} ${bcy - by * .6} C${cx - 58} ${bcy - by - 44} ${cx - 78} ${bcy - 6} ${cx - 34} ${bcy + 6} C${cx - 52} ${bcy - 8} ${cx - 44} ${bcy - 22} ${cx - 12} ${bcy - by * .25}Z" fill="#fff" stroke="#F0D77A" stroke-width="2.5"/>`;
    o += wing + `<g transform="translate(120 0) scale(-1 1)">${wing}</g>`;
  }
  if (T.cape) {
    const w = bx + 6 + tier * 3;
    o += `<path d="M${f(cx - bx * .6)} ${f(bcy - by * .75)} Q${cx} ${f(bcy - by * .5)} ${f(cx + bx * .6)} ${f(bcy - by * .75)} L${cx + w} 117 Q${cx} 126 ${cx - w} 117Z" fill="${T.cape}" stroke="rgba(0,0,0,.12)" stroke-width="2"/>`;
  }
  // kind-specific back parts
  const back = {
    dino: `<path d="M${cx - bx + 4} ${bcy + 8} Q${cx - bx - 28} ${bcy + 18} ${cx - bx - 22} ${bcy - 8} Q${cx - bx - 10} ${bcy + 6} ${cx - bx + 8} ${bcy}Z" fill="${c.main}"/>
      <polygon points="${cx - 20},${cy - r + 9} ${cx - 14},${cy - r - 10} ${cx - 6},${cy - r + 4} ${cx},${cy - r - 15} ${cx + 6},${cy - r + 4} ${cx + 14},${cy - r - 10} ${cx + 20},${cy - r + 9}" fill="${c.dark}"/>`,
    cat: `<path d="M${cx - bx + 2} ${bcy + 14} Q${cx - bx - 26} ${bcy + 10} ${cx - bx - 16} ${bcy - 16}" stroke="${c.main}" stroke-width="9" fill="none" stroke-linecap="round"/>
      <polygon points="${f(cx - r * .92)},${f(cy - r * .4)} ${f(cx - r * .8)},${f(cy - r * 1.32)} ${f(cx - r * .2)},${f(cy - r * .82)}" fill="${c.main}"/><polygon points="${f(cx + r * .92)},${f(cy - r * .4)} ${f(cx + r * .8)},${f(cy - r * 1.32)} ${f(cx + r * .2)},${f(cy - r * .82)}" fill="${c.main}"/>
      <polygon points="${f(cx - r * .76)},${f(cy - r * .58)} ${f(cx - r * .72)},${f(cy - r * 1.06)} ${f(cx - r * .38)},${f(cy - r * .8)}" fill="#FF8FB8"/><polygon points="${f(cx + r * .76)},${f(cy - r * .58)} ${f(cx + r * .72)},${f(cy - r * 1.06)} ${f(cx + r * .38)},${f(cy - r * .8)}" fill="#FF8FB8"/>`,
    bunny: `<circle cx="${cx - bx + 2}" cy="${bcy + 12}" r="9" fill="#fff"/>
      <ellipse cx="${f(cx - r * .42)}" cy="${f(cy - r * 1.2)}" rx="${f(r * .27)}" ry="${f(r * .8)}" fill="${c.main}"/><ellipse cx="${f(cx + r * .42)}" cy="${f(cy - r * 1.2)}" rx="${f(r * .27)}" ry="${f(r * .8)}" fill="${c.main}"/>
      <ellipse cx="${f(cx - r * .42)}" cy="${f(cy - r * 1.15)}" rx="${f(r * .13)}" ry="${f(r * .55)}" fill="#fff"/><ellipse cx="${f(cx + r * .42)}" cy="${f(cy - r * 1.15)}" rx="${f(r * .13)}" ry="${f(r * .55)}" fill="#fff"/>`,
    bear: `<circle cx="${f(cx - r * .76)}" cy="${f(cy - r * .74)}" r="${f(r * .34)}" fill="${c.main}"/><circle cx="${f(cx + r * .76)}" cy="${f(cy - r * .74)}" r="${f(r * .34)}" fill="${c.main}"/>
      <circle cx="${f(cx - r * .76)}" cy="${f(cy - r * .74)}" r="${f(r * .18)}" fill="${c.belly}"/><circle cx="${f(cx + r * .76)}" cy="${f(cy - r * .74)}" r="${f(r * .18)}" fill="${c.belly}"/>`,
    giraffe: `<path d="M${cx - 8} ${f(cy + r * .5)} L${cx - 9} ${bcy - by + 10} L${cx + 9} ${bcy - by + 10} L${cx + 8} ${f(cy + r * .5)}Z" fill="${c.main}"/>
      <circle cx="${cx - 3}" cy="${f(cy + r * 1.3)}" r="4" fill="${c.dark}" opacity=".55"/><circle cx="${cx + 4}" cy="${f(cy + r * 1.9)}" r="3.5" fill="${c.dark}" opacity=".55"/><circle cx="${cx - 2}" cy="${f(cy + r * 2.4)}" r="3" fill="${c.dark}" opacity=".55"/>
      <path d="M${f(cx - r * .34)} ${f(cy - r * .8)} L${f(cx - r * .44)} ${f(cy - r * 1.45)} M${f(cx + r * .34)} ${f(cy - r * .8)} L${f(cx + r * .44)} ${f(cy - r * 1.45)}" stroke="${c.dark}" stroke-width="5" stroke-linecap="round"/>
      <circle cx="${f(cx - r * .44)}" cy="${f(cy - r * 1.5)}" r="5" fill="${c.dark}"/><circle cx="${f(cx + r * .44)}" cy="${f(cy - r * 1.5)}" r="5" fill="${c.dark}"/>
      <ellipse cx="${f(cx - r * .98)}" cy="${f(cy - r * .2)}" rx="${f(r * .3)}" ry="${f(r * .14)}" fill="${c.main}" transform="rotate(-25 ${f(cx - r * .98)} ${f(cy - r * .2)})"/><ellipse cx="${f(cx + r * .98)}" cy="${f(cy - r * .2)}" rx="${f(r * .3)}" ry="${f(r * .14)}" fill="${c.main}" transform="rotate(25 ${f(cx + r * .98)} ${f(cy - r * .2)})"/>`,
    penguin: `<path d="M${cx - 6} ${f(cy - r + 2)} q4 -12 10 -2" stroke="${c.main}" stroke-width="4" fill="none" stroke-linecap="round"/>`,
    fox: `<path d="M${cx - bx + 2} ${bcy + 10} Q${cx - bx - 40} ${bcy + 14} ${cx - bx - 30} ${bcy - 22} Q${cx - bx - 14} ${bcy - 4} ${cx - bx + 6} ${bcy}Z" fill="${c.main}"/>
      <path d="M${cx - bx - 30} ${bcy - 22} Q${cx - bx - 36} ${bcy - 6} ${cx - bx - 22} ${bcy - 2} Q${cx - bx - 26} ${bcy - 12} ${cx - bx - 30} ${bcy - 22}Z" fill="#fff"/>
      <polygon points="${f(cx - r * .95)},${f(cy - r * .3)} ${f(cx - r * .78)},${f(cy - r * 1.55)} ${f(cx - r * .15)},${f(cy - r * .85)}" fill="${c.main}"/><polygon points="${f(cx + r * .95)},${f(cy - r * .3)} ${f(cx + r * .78)},${f(cy - r * 1.55)} ${f(cx + r * .15)},${f(cy - r * .85)}" fill="${c.main}"/>
      <polygon points="${f(cx - r * .76)},${f(cy - r * .55)} ${f(cx - r * .7)},${f(cy - r * 1.2)} ${f(cx - r * .38)},${f(cy - r * .85)}" fill="#3B2A2A"/><polygon points="${f(cx + r * .76)},${f(cy - r * .55)} ${f(cx + r * .7)},${f(cy - r * 1.2)} ${f(cx + r * .38)},${f(cy - r * .85)}" fill="#3B2A2A"/>`,
    pig: `<path d="M${cx - bx} ${bcy + 6} q-10 -2 -8 -10 q6 -2 4 6" stroke="${c.dark}" stroke-width="3" fill="none"/>
      <polygon points="${f(cx - r * .9)},${f(cy - r * .5)} ${f(cx - r * .82)},${f(cy - r * 1.18)} ${f(cx - r * .3)},${f(cy - r * .86)}" fill="${c.dark}"/><polygon points="${f(cx + r * .9)},${f(cy - r * .5)} ${f(cx + r * .82)},${f(cy - r * 1.18)} ${f(cx + r * .3)},${f(cy - r * .86)}" fill="${c.dark}"/>`,
  };
  o += back[k] || back.dino;
  // feet, body, belly
  const footC = k === 'penguin' ? '#FFA53D' : c.dark, fw = Math.max(11, bx * .42);
  o += `<ellipse cx="${f(cx - bx * .48)}" cy="113" rx="${f(fw)}" ry="7" fill="${footC}"/><ellipse cx="${f(cx + bx * .48)}" cy="113" rx="${f(fw)}" ry="7" fill="${footC}"/>`;
  o += `<ellipse cx="${cx}" cy="${bcy}" rx="${bx}" ry="${by}" fill="${c.main}"/>`;
  o += `<ellipse cx="${cx}" cy="${f(bcy + by * .2)}" rx="${f(bx * .64)}" ry="${f(by * .62)}" fill="${c.belly}"/>`;
  if (k === 'giraffe') o += `<circle cx="${cx - 14}" cy="${bcy - 8}" r="4" fill="${c.dark}" opacity=".5"/><circle cx="${cx + 15}" cy="${bcy + 6}" r="4" fill="${c.dark}" opacity=".5"/>`;
  if (T.armor) {
    const m = T.gold ? '#FFD23F' : '#D7DEEA', md = T.gold ? '#D99A00' : '#8E9BB3';
    o += `<path d="M${f(cx - bx * .72)} ${f(bcy - by * .55)} Q${cx} ${f(bcy - by * .85)} ${f(cx + bx * .72)} ${f(bcy - by * .55)} L${f(cx + bx * .62)} ${f(bcy + by * .45)} Q${cx} ${f(bcy + by * .78)} ${f(cx - bx * .62)} ${f(bcy + by * .45)}Z" fill="${m}" stroke="${md}" stroke-width="2.5"/>`;

  // left arm
  o += `<ellipse cx="${cx - bx}" cy="${bcy - 2}" rx="8" ry="11" fill="${k === 'penguin' ? c.dark : c.main}" transform="rotate(25 ${cx - bx} ${bcy - 2})"/>`;
  // head
  o += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${c.main}"/>`;
  if (k === 'penguin') o += `<ellipse cx="${cx}" cy="${f(cy + r * .14)}" rx="${f(r * .8)}" ry="${f(r * .72)}" fill="#fff"/>`;
  if (k === 'fox') o += `<path d="M${f(cx - r * .9)} ${f(cy + r * .1)} Q${cx} ${f(cy + r * 1.15)} ${f(cx + r * .9)} ${f(cy + r * .1)} Q${cx} ${f(cy + r * .5)} ${f(cx - r * .9)} ${f(cy + r * .1)}Z" fill="#fff"/>`;
  if (k === 'bear' || k === 'giraffe') o += `<ellipse cx="${cx}" cy="${f(cy + r * .45)}" rx="${f(r * .5)}" ry="${f(r * .34)}" fill="${c.belly}"/>`;
  // eyes
  const ex = r * .4, ey = cy - r * .02, erx = r * .26, ery = r * .29;
  o += `<g class="eyes"><ellipse cx="${f(cx - ex)}" cy="${f(ey)}" rx="${f(erx)}" ry="${f(ery)}" fill="#fff"/><ellipse cx="${f(cx + ex)}" cy="${f(ey)}" rx="${f(erx)}" ry="${f(ery)}" fill="#fff"/>
    <circle cx="${f(cx - ex + r * .08)}" cy="${f(ey + r * .06)}" r="${f(r * .17)}" fill="#3B2A5C"/><circle cx="${f(cx + ex + r * .08)}" cy="${f(ey + r * .06)}" r="${f(r * .17)}" fill="#3B2A5C"/>
    <circle cx="${f(cx - ex + r * .14)}" cy="${f(ey - r * .02)}" r="${f(r * .06)}" fill="#fff"/><circle cx="${f(cx + ex + r * .14)}" cy="${f(ey - r * .02)}" r="${f(r * .06)}" fill="#fff"/></g>`;
  o += `<g class="xeyes" stroke="#3B2A5C" stroke-width="3.5" stroke-linecap="round"><path d="M${f(cx - ex - 6)} ${f(ey - 6)}l12 12M${f(cx - ex + 6)} ${f(ey - 6)}l-12 12M${f(cx + ex - 6)} ${f(ey - 6)}l12 12M${f(cx + ex + 6)} ${f(ey - 6)}l-12 12"/></g>`;
  o += `<ellipse cx="${f(cx - r * .72)}" cy="${f(cy + r * .42)}" rx="${f(r * .2)}" ry="${f(r * .13)}" fill="#FF6FA8" opacity=".45"/><ellipse cx="${f(cx + r * .72)}" cy="${f(cy + r * .42)}" rx="${f(r * .2)}" ry="${f(r * .13)}" fill="#FF6FA8" opacity=".45"/>`;
  // face details
  if (k === 'penguin') o += `<polygon points="${cx - 7},${f(cy + r * .26)} ${cx + 9},${f(cy + r * .3)} ${cx},${f(cy + r * .52)}" fill="#FFA53D"/>`;
  else {
    if (k === 'pig') o += `<ellipse cx="${cx}" cy="${f(cy + r * .3)}" rx="${f(r * .3)}" ry="${f(r * .2)}" fill="${c.dark}"/><ellipse cx="${cx - 4}" cy="${f(cy + r * .3)}" rx="2" ry="3" fill="#8E3B52"/><ellipse cx="${cx + 4}" cy="${f(cy + r * .3)}" rx="2" ry="3" fill="#8E3B52"/>`;
    if (k === 'fox' || k === 'bear' || k === 'bunny' || k === 'cat') o += `<ellipse cx="${cx + 1}" cy="${f(cy + r * .3)}" rx="${f(r * .1)}" ry="${f(r * .07)}" fill="#3B2A2A"/>`;
    if (k === 'giraffe') o += `<circle cx="${cx - 5}" cy="${f(cy + r * .38)}" r="2" fill="${c.dark}"/><circle cx="${cx + 5}" cy="${f(cy + r * .38)}" r="2" fill="${c.dark}"/>`;
    const my = cy + r * (k === 'pig' ? .62 : .5);
    o += `<path d="M${f(cx - r * .26)} ${f(my)} Q${f(cx + r * .03)} ${f(my + r * .26)} ${f(cx + r * .3)} ${f(my)}" stroke="#3B2A5C" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
  }
  if (k === 'cat') o += `<g stroke="${c.dark}" stroke-width="2.2" stroke-linecap="round"><line x1="${f(cx - r * 1.1)}" y1="${f(cy + r * .24)}" x2="${f(cx - r * .62)}" y2="${f(cy + r * .3)}"/><line x1="${f(cx - r * 1.1)}" y1="${f(cy + r * .46)}" x2="${f(cx - r * .62)}" y2="${f(cy + r * .4)}"/><line x1="${f(cx + r * 1.1)}" y1="${f(cy + r * .24)}" x2="${f(cx + r * .62)}" y2="${f(cy + r * .3)}"/><line x1="${f(cx + r * 1.1)}" y1="${f(cy + r * .46)}" x2="${f(cx + r * .62)}" y2="${f(cy + r * .4)}"/></g>`;

    o += `<path d="M${f(cx - hr)} ${f(hb)} A${f(hr)} ${f(hr)} 0 0 1 ${f(cx + hr)} ${f(hb)}Z" fill="${T.helm}" stroke="${T.helmDk}" stroke-width="2.5"/>`;
    o += `<rect x="${f(cx - hr * 1.04)}" y="${f(hb - r * .12)}" width="${f(hr * 2.08)}" height="${f(r * .16)}" rx="${f(r * .08)}" fill="${T.helmDk}"/>`;
    o += `<path d="M${cx} ${f(hb - hr + 3)} L${cx} ${f(hb - 4)}" stroke="${T.helmDk}" stroke-width="3" opacity=".6"/>`;
    if (T.gem) o += `<circle cx="${cx}" cy="${f(hb - hr * .45)}" r="${f(r * .14)}" fill="#3DDC97" stroke="#fff" stroke-width="2"/>`;
  }
  if (T.halo) o += `<ellipse cx="${cx}" cy="${f(cy - r * 1.75)}" rx="${f(r * .62)}" ry="${f(r * .16)}" fill="none" stroke="#FFE14D" stroke-width="4.5"/>`;
  // sword + right hand
  const L = T.len, tipY = hy - 14 - L;
  let blade = `<path d="M${hx - 4} ${hy - 6} L${hx - 4} ${hy - 6 - L} L${hx} ${tipY} L${hx + 4} ${hy - 6 - L} L${hx + 4} ${hy - 6}Z" fill="${T.blade}" stroke="${T.edge}" stroke-width="2"/>`;
  if (tier === 0) blade += `<path d="M${hx} ${hy - 10} L${hx} ${tipY + 10}" stroke="#B9844F" stroke-width="1.5"/>`;
  if (tier === 1) blade += `<path d="M${hx} ${hy - 10} L${hx} ${tipY + 6}" stroke="#fff" stroke-width="2"/>`;
  if (tier === 2) blade += `<path d="M${hx} ${tipY - 16} q-10 12 -2 22 q2 -8 6 -10 q4 6 4 10 q8 -10 -8 -22Z" fill="#FFD23F"/><path d="M${hx} ${hy - 12} L${hx} ${tipY + 8}" stroke="#FFD23F" stroke-width="2.5"/>`;
  if (tier === 3) blade += `<path d="M${hx + 1} ${hy - 10} l-3 -10 l5 -6 l-4 -12 l5 -6 l-3 -10" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M${hx + 8} ${tipY + 4} l6 -8 l-2 7 l6 -2 l-8 10Z" fill="#FFE14D"/>`;

  o += `<g class="sword" style="transform-origin:${hx}px ${hy}px">${blade}
    <rect x="${hx - 14}" y="${hy - 8}" width="28" height="7" rx="3.5" fill="${T.guard}" stroke="rgba(0,0,0,.2)" stroke-width="1.5"/>
    <rect x="${hx - 3}" y="${hy - 1}" width="6" height="14" rx="2" fill="#8B5A2B"/><circle cx="${hx}" cy="${hy + 15}" r="4" fill="${T.guard}"/></g>`;
  o += `<ellipse cx="${hx - 1}" cy="${hy + 4}" rx="8" ry="9" fill="${k === 'penguin' ? c.dark : c.main}"/>`;
  return `<svg viewBox="-5 -48 140 168" xmlns="http://www.w3.org/2000/svg">${o}</svg>`;
}

    add10: () => { for (let a = 1; a <= 9; a++) for (let b = 1; a + b <= 10; b++) out.push(E(a, '+', b)); },
    sub5: () => { for (let a = 2; a <= 5; a++) for (let b = 1; b < a; b++) out.push(E(a, '-', b)); },

}

    const [c, r] = use[i];
    const b = document.createElement('button');
    b.className = `bub c${(i + rand(0, 5)) % 6}`;
    const jx = (Math.random() - .5) * .14, jy = rows === 1 ? (c % 2 ? .1 : -.1) + (Math.random() - .5) * .1 : (Math.random() - .5) * .14;
    b.style.left = ((c + .5 + jx) / cols * 100) + '%';
    b.style.top = (Math.max(.2, Math.min(.8, (r + .5 + jy) / rows)) * 100) + '%';
    b.style.animationDelay = `${i * .06}s, ${.4 + Math.random()}s`;
    b.innerHTML = o.html;
    b.onpointerdown = e => { e.preventDefault(); tapBubble(o, b); };
    f.appendChild(b);
  });
  say(q.say);
}
function fxAt(el) { const r = el.getBoundingClientRect(), fr = $('#fx').getBoundingClientRect(); return [r.left - fr.left + r.width / 2, r.top - fr.top + r.height / 2]; }
function sparks(el, glyphs, count = 9) {
  const [x, y] = fxAt(el);
  for (let i = 0; i < count; i++) {
    const s = document.createElement('span'); s.className = 'spark'; s.textContent = pick(glyphs);
    s.style.left = x + 'px'; s.style.top = y + 'px';
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 110;
    s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px');
    $('#fx').appendChild(s); setTimeout(() => s.remove(), 850);
  }
}
function fxEl(cls, el, text, ms = 950) {
  const [x, y] = fxAt(el); const d = document.createElement('div'); d.className = cls;
  d.style.left = x + 'px'; d.style.top = y + 'px'; if (text) d.textContent = text;
  $('#fx').appendChild(d); setTimeout(() => d.remove(), ms); return d;
}
function flash() { const d = document.createElement('div'); d.className = 'flash'; $('#fx').appendChild(d); setTimeout(() => d.remove(), 400); }
function bigText(t, ouch) { const c = document.createElement('div'); c.className = 'combo' + (ouch ? ' ouch' : ''); c.textContent = t; $('#fx').appendChild(c); setTimeout(() => c.remove(), 1100); }
function tierFx(t, m, big) {
  const [x, y] = fxAt(m);
  if (t === 0) { fxEl('slash' + (big ? ' big' : ''), m); sparks(m, ['💥', '✨'], 6); SFX.hit(); }
  if (t === 1) { fxEl('slash' + (big ? ' big' : ''), m); setTimeout(() => { fxEl('slash rev', m); SFX.hit(); }, 140); sparks(m, ['💥', '✨'], 8); SFX.hit(); }
  if (t === 2) { fxEl('slash fire' + (big ? ' big' : ''), m); sparks(m, ['🔥', '🔥', '💥'], 12); SFX.hit(); }
  if (t === 3) {
    const b = document.createElement('div'); b.className = 'bolt'; b.style.left = x + 'px'; b.style.height = y + 'px';
    b.innerHTML = `<svg viewBox="0 0 40 100" preserveAspectRatio="none"><path d="M22 0 L8 44 L20 44 L6 100 L34 36 L20 36 L32 0Z" fill="#FFE14D" stroke="#fff" stroke-width="2"/></svg>`;
    $('#fx').appendChild(b); setTimeout(() => b.remove(), 550);
    flash(); sparks(m, ['⚡', '⚡', '💥'], 12); SFX.zap();
  }
  if (t === 4) {
    const h = $('#hero'), [hx2, hy2] = fxAt(h);
    const dr = document.createElement('div'); dr.className = 'dragon'; dr.textContent = '🐉';
    dr.style.left = hx2 + 'px'; dr.style.top = hy2 + 'px';
    dr.style.setProperty('--dx', (x - hx2) + 'px'); dr.style.setProperty('--dy', (y - hy2) + 'px');
    $('#fx').appendChild(dr); setTimeout(() => dr.remove(), 420);
    fxEl('slash ice big', m); sparks(m, ['❄️', '❄️', '💎'], 12); SFX.hit(); SFX.zap();
  }
  if (t === 5) {
    const b = document.createElement('div'); b.className = 'beam'; b.style.left = x + 'px'; b.style.height = (y + 60) + 'px';
    $('#fx').appendChild(b); setTimeout(() => b.remove(), 750);
    flash(); sparks(m, ['🌟', '✨', '💥', '⭐'], 16); SFX.holy(); SFX.hit();
  }
}
async function heroAttack(dmg) {
  const h = $('#hero'), m = $('#monster');
  const hr = h.getBoundingClientRect(), mr = m.getBoundingClientRect();
  h.style.setProperty('--dash', Math.max(0, mr.left - hr.right + hr.width * .45) + 'px');
  anim(h, 'atk'); SFX.swoosh();
  await wait(290);
  tierFx(G.tier, m, dmg > 1); anim(m, 'hit');
  const f = G.foes[G.fi]; f.hp = Math.max(0, f.hp - dmg); renderFoe();
  fxEl('dmg', m, `-${dmg}`);
  await wait(450);
  h.classList.remove('atk');
}
async function foeAttack(timeUp) {
  const h = $('#hero'), m = $('#monster');
  const hr = h.getBoundingClientRect(), mr = m.getBoundingClientRect();
  m.style.setProperty('--lunge', -(mr.left - hr.right + hr.width * .25) + 'px');
  anim(m, 'lunge'); G.foes[G.fi].boss ? SFX.bossRoar() : SFX.roar();
  if (timeUp) bigText(G.foes[G.fi].boss ? `${G.foes[G.fi].name}攻擊！` : '怪獸攻擊！', true);
  await wait(290);
  SFX.hurt(); sparks(h, ['💢', '💫'], 6);
  if (G.foes[G.fi].boss) retrigger($('#game'), 'shake');
  G.charge = 0;
  loseHeart();
  await wait(380);
  m.classList.remove('lunge');
}
function loseHeart() {
  G.hearts--; renderHearts();
  anim($('#hero'), 'hurt');
  if (G.hearts <= 0) die();
}
async function tapBubble(o, el) {
  if (!G || !G.running || G.lock || G.paused) return;
  G.lock = true;
  if (o.ok) {
    G.streak++;
    el.classList.add('pop'); sparks(el, ['⭐', '✨', '💖']);
    document.querySelectorAll('#field .bub:not(.pop)').forEach(b => b.classList.add('fade'));
    SFX.good();
    const dmg = G.streak >= 3 ? 2 : 1;
    if (dmg > 1) { bigText(`連擊 ×${G.streak}！${TIERS[G.tier].atk}`); SFX.combo(); }
    else bigText(G.tier > 0 ? `${TIERS[G.tier].atk}！` : pick(['答對了！', '好棒！', '厲害！']));
    G.charge = Math.max(0, G.charge - .4);
    await heroAttack(dmg);
    if (!G.running) return;
    const f = G.foes[G.fi];
    if (f.boss && !G.rage && f.hp > 0 && f.hp <= f.max / 2) {
      G.rage = true; $('#foe').classList.add('rage'); SFX.bossRoar(); retrigger($('#game'), 'shake');
      bigText(`${f.name}生氣了！`, true); say(`${f.name}生氣了！攻擊變快了！`);
      await wait(900);
    }
    if (f.hp <= 0) {
      anim($('#monster'), 'ko'); SFX.ko(); sparks($('#monster'), ['🪙', '⭐', '✨', '💎'], f.boss ? 24 : 12);
      if (f.boss) { flash(); confetti(); }
      bigText(f.boss ? `打倒${f.name}！` : '打倒了！');
      renderWave();
      await wait(f.boss ? 1100 : 750);
      if (G.fi + 1 >= G.foes.length) { win(); return; }
      G.scroll += 22;
      $('#strip').style.transform = `translateX(-${G.scroll}vw)`;
      $('#ground').style.backgroundPosition = `0 0, -${G.scroll * 9}px 0`;
      G.charge = 0;
      setFoe(G.fi + 1); anim($('#monster'), 'enter'); renderWave(); SFX.roar();
      await wait(700);
      if (!G.running) return;
    }
    G.lock = false; nextRound(false);
  } else {
    G.streak = 0;
    el.classList.add('wrong'); SFX.bad();
    bigText('答錯了！怪獸反擊', true);
    await foeAttack(false);
    if (G.hearts > 0) { say(pick(['再想想看', '不對喔，再算一次', '仔細看看'])); if (G.running) G.lock = false; }
  }
}
async function die() {
  G.running = false; G.lock = true; setMusicSpeed(false);
  await wait(400);
  $('#hero').className = 'dead';
  anim($('#monster'), 'laugh');
  SFX.die();
  say('哎呀，勇者倒下了，我們再試一次！');
  await wait(1300);
  overlay(`<div class="heroBig dead">${charSVG(P[cur].char, G.tier)}</div><h2>勇者倒下了！</h2>
    <p>錯了 3 次，這關要從頭開始。<br>算清楚再點喔！</p>
    <div class="row"><button class="btn pink" data-act="retry">再試一次</button><button class="btn ghost" data-act="map">回地圖</button></div>`);
}
async function win() {
  G.running = false; G.lock = true; setMusicSpeed(false);
  const k = P[cur], key = lvKey(k, G.wi, G.li);
  const stars = G.hearts, firstClear = !k.stars[key], oldTier = tierOf(k);
  k.stars[key] = Math.max(k.stars[key] || 0, stars);
  G.newTier = tierOf(k) > oldTier ? tierOf(k) : null;
  let newSticker = null;
  if (G.L.boss && firstClear) {
    const left = STICKERS.filter(s => !k.stickers.includes(s));
    newSticker = left.length ? pick(left) : null;
    if (newSticker) k.stickers.push(newSticker);
  }
  save(cur);
  $('#hero').classList.add('dance');
  $('#field').innerHTML = ''; $('#target').innerHTML = '';
  SFX.win(); confetti();
  say(stars === 3 ? '完美勝利！三顆星星！' : '勝利了！好厲害！');
  await wait(1200);
  const st = [0, 1, 2].map(i => `<span class="${i < stars ? '' : 'off'}" style="animation-delay:${i * .2}s">⭐</span>`).join('');
  if (newSticker) {
    G.sticker = newSticker;
    overlay(`<h2>打倒魔王！</h2><div class="bigstars">${st}</div><p>點寶箱打開看看！</p><button class="chest" data-act="chest" aria-label="打開寶箱">🎁</button>`);
  } else if (G.newTier) {
    showLevelUp();
  } else {
    winPanel(st, stars);
  }
}
function winPanel(st, stars) {
  overlay(`<h2>勝利！</h2><div class="bigstars">${st}</div>
    <p>${stars === 3 ? '一滴血都沒掉，太完美了！' : '再玩一次可以拿到更多星星喔！'}</p>
    <div class="row">${nextLevel() ? '<button class="btn mint" data-act="next">下一關 ▶</button>' : ''}
    <button class="btn ghost" data-act="retry">再玩一次</button><button class="btn ghost" data-act="map">回地圖</button></div>`);
}
function showLevelUp() {
  const t = G.newTier, ch = P[cur].char; G.newTier = null;
  overlay(`<h2>勇者升級了！</h2>
    <div class="lvup"><div class="heroBig">${charSVG(ch, t - 1)}</div><span class="arrow">➜</span><div class="heroBig">${charSVG(ch, t)}</div></div>
    <p>獲得【${TIERS[t].w}】！<br>學會新招式【${TIERS[t].atk}】！</p>
    <div class="row">${nextLevel() ? '<button class="btn mint" data-act="next">去下一個世界 ▶</button>' : ''}<button class="btn ghost" data-act="map">回地圖</button></div>`);
  SFX.lvup(); confetti();
  say(`勇者升級了！獲得${TIERS[t].w}，學會${TIERS[t].atk}！`);
}
function nextLevel() {
  const W = WORLDS[P[cur].grade];
  if (G.li + 1 < W[G.wi].levels.length) return [G.wi, G.li + 1];
  if (G.wi + 1 < W.length) return [G.wi + 1, 0];
  return null;
}
function confetti() {
  const cols = ['#FF6FA8', '#FFD23F', '#3DDC97', '#6EC8FF', '#8C5CF5', '#FF8A3D'];
  for (let i = 0; i < 60; i++) {
    const c = document.createElement('div'); c.className = 'conf';
    c.style.left = Math.random() * 100 + '%'; c.style.background = pick(cols);
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's'; c.style.animationDelay = Math.random() * .5 + 's';
    $('#fx').appendChild(c); setTimeout(() => c.remove(), 3800);
  }
}
function pause() {
  if (!G || !G.running || G.paused) return;
  G.paused = true;
  overlay(`<h2>休息一下</h2>
    <div class="row"><button class="btn mint" data-act="resume">繼續 ▶</button><button class="btn ghost" data-act="retry">重新開始</button><button class="btn ghost" data-act="map">回地圖</button></div>
    <div class="toggles">${toggleBtns()}</div>`);
}
function toggleBtns() {
  return `<button data-act="t-music" class="${S.music ? 'on' : ''}">🎵 音樂</button><button data-act="t-sfx" class="${S.sfx ? 'on' : ''}">🔔 音效</button><button data-act="t-voice" class="${S.voice ? 'on' : ''}">🗣️ 唸題目</button>`;
}
// silence everything while the page is in the background (another app, another tab)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pause(); if (AC) AC.suspend(); try { speechSynthesis.cancel(); } catch (e) {} }
  else if (AC) AC.resume();
});

/* ================= overlay & actions ================= */
function overlay(html, cls) { const o = $('#ov'); o.className = ''; o.innerHTML = `<div class="panel ${cls || ''}">${html}</div>`; o.hidden = false; }
function stopGame() { if (G) G.running = false; cancelAnimationFrame(rafId); setMusicSpeed(false); try { speechSynthesis.cancel(); } catch (e) {} }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  ac();
  if (a !== 'speak') SFX.tap();
  switch (a) {
    case 'home': stopGame(); renderHome(); break;
    case 'map': stopGame(); openMap(); break;
    case 'book': openBook(); break;
    case 'go': go(); break;
    case 'speak': say(lastSay); break;
    case 'pause': pause(); break;
    case 'resume': $('#ov').hidden = true; G.paused = false; lastT = performance.now(); say(lastSay); break;
    case 'retry': stopGame(); startLevel(G.wi, G.li); break;
    case 'next': { const n = nextLevel(); stopGame(); if (n) startLevel(n[0], n[1]); else openMap(); break; }
    case 'chest': {
      SFX.chest();
      const more = G.newTier ? '<button class="btn mint" data-act="lvup">看看新武器 ⚔️</button>'
        : `${nextLevel() ? '<button class="btn mint" data-act="next">下一個世界 ▶</button>' : ''}<button class="btn ghost" data-act="book">看貼紙簿</button><button class="btn ghost" data-act="map">回地圖</button>`;
      overlay(`<h2>得到新貼紙！</h2><div class="got">${G.sticker}</div><p>已經放進貼紙簿囉！</p><div class="row">${more}</div>`);
      confetti(); say('得到新貼紙了！');
      break;
    }
    case 'lvup': showLevelUp(); break;
    case 't-music': case 't-sfx': case 't-voice': {
      const key = a.slice(2); S[key] = !S[key]; lsSet('mq-settings', S);
      b.classList.toggle('on', S[key]); if (key === 'music') musicOn();
      break;
    }
    case 'p-close': renderHome(); break;
  }
});

/* ================= parent settings (hold gear 2s) ================= */
(() => {
  const gear = $('#gear'), ring = $('#gearRing'), hint = $('#gearHint');
  let t0 = 0, raf = 0;
  const tick = () => {
    const p = Math.min(1, (performance.now() - t0) / 2000);
    ring.style.clipPath = `inset(0 ${100 - p * 100}% 0 0)`;
    if (p >= 1) { end(); openParent(); return; }
    raf = requestAnimationFrame(tick);
  };
  const start = e => { e.preventDefault(); t0 = performance.now(); hint.style.opacity = 1; raf = requestAnimationFrame(tick); };
  const end = () => { cancelAnimationFrame(raf); ring.style.clipPath = 'inset(0 100% 0 0)'; setTimeout(() => hint.style.opacity = 0, 1200); };
  gear.addEventListener('pointerdown', start);
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => gear.addEventListener(ev, end));
  gear.addEventListener('contextmenu', e => e.preventDefault());
})();
function openParent() {
  const sets = KIDS.map(id => {
    const k = P[id];
    return `<div class="kidset" data-kid="${id}">
      <label for="nm-${id}">名字</label><input id="nm-${id}" value="${esc(k.name)}" maxlength="8">
      <label for="gr-${id}">程度</label><select id="gr-${id}"><option value="big" ${k.grade === 'big' ? 'selected' : ''}>大班（10以內加減→20以內）</option><option value="g2" ${k.grade === 'g2' ? 'selected' : ''}>小二（二位數加減、九九乘法→小三）</option></select>
      <div class="acts"><button data-p="char">換角色</button><button data-p="unlock">全部關卡解鎖</button><button class="warn" data-p="reset">清除進度</button></div>
    </div>`;
  }).join('');
  overlay(`<h2>家長設定</h2>${sets}<div class="toggles">${toggleBtns()}</div>
    <p style="font-size:15px;color:var(--muted)">不同程度的星星分開記錄；切換程度不會清掉原本的進度。「全部關卡解鎖」也會把武器升到最強。</p>
    <div class="row"><button class="btn mint" data-act="p-close">完成</button></div>`, 'parent');
  KIDS.forEach(id => {
    $(`#nm-${id}`).onchange = e => { P[id].name = e.target.value.trim() || DEF[id].name; save(id); };
    $(`#gr-${id}`).onchange = e => { P[id].grade = e.target.value; save(id); };
  });
  $('#ov').querySelectorAll('[data-p]').forEach(b => b.onclick = () => {
    const id = b.closest('.kidset').dataset.kid, k = P[id];
    if (b.dataset.p === 'char') { k.char = null; save(id); b.textContent = '下次進入會重選 ✓'; }
    if (b.dataset.p === 'unlock') {
      WORLDS[k.grade].forEach((W, wi) => W.levels.forEach((L, li) => { const key = lvKey(k, wi, li); if (!k.stars[key]) k.stars[key] = 1; }));
      save(id); b.textContent = '已解鎖 ✓';
    }
    if (b.dataset.p === 'reset') {
      if (b.dataset.armed) { k.stars = {}; k.stickers = []; save(id); b.textContent = '已清除 ✓'; delete b.dataset.armed; }
      else { b.dataset.armed = 1; b.textContent = '再按一次確認清除'; }
    }
  });
}

renderHome();
</script>
</body>
